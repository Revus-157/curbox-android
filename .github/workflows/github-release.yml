name: GitHub Release

on:
  push:
    tags:
      - 'v*-hermes.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version name for the release (e.g. v1.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Read changelog for this version
        id: desc
        run: |
          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' app/build.gradle.kts | tr -dc '0-9')"
          CHANGELOG="fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"

          if [ ! -s "$CHANGELOG" ]; then
            echo "::error::No changelog at $CHANGELOG. Write it before tagging the release."
            exit 1
          fi

          {
            echo "body<<RELEASE_EOF"
            cat "$CHANGELOG"
            echo ""
            echo "RELEASE_EOF"
          } >> $GITHUB_OUTPUT

      - name: Set up JDK 21
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install Android Build Tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Give permission to executable
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fdroid Release APK
        run: ./gradlew assembleFdroidRelease

      - name: Sign Fdroid APK with Android Build Tools 35
        id: apk
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_KEY"
          test -n "$ALIAS"
          test -n "$KEY_STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          SRC="app/build/outputs/apk/fdroid/release/app-fdroid-universal-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/curbox-fdroid-aligned.apk"
          KEYSTORE="$RUNNER_TEMP/hermes-curbox-release.jks"
          DEST="curbox-${{ steps.tag.outputs.name }}-fdroid.apk"
          printf '%s' "$SIGNING_KEY" | base64 --decode > "$KEYSTORE"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$SRC" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$DEST" \
            "$ALIGNED"
          rm -f "$KEYSTORE" "$ALIGNED"
          echo "path=$DEST" >> $GITHUB_OUTPUT

      - name: Verify and document signed APK
        id: release_info
        run: |
          APK="${{ steps.apk.outputs.path }}"
          INFO="curbox-${{ steps.tag.outputs.name }}-release-info.txt"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          {
            echo "Release: ${{ steps.tag.outputs.name }}"
            echo "APK: $APK"
            echo "SHA-256: $(sha256sum "$APK" | cut -d' ' -f1)"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" \
              | grep -E '^Signer #1 certificate SHA-256 digest:'
          } > "$INFO"
          cat "$INFO"
          echo "path=$INFO" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body: ${{ steps.desc.outputs.body }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.release_info.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
